services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_pm_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      BACKEND_API_URL: http://backend:8000
      EMBEDDING_API_URL: http://embedding_api:8001
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

    depends_on:
      - embedding_api
    extra_hosts:
      - "host.docker.internal:host-gateway"

  embedding_api:
    build:
      context: .
      dockerfile: embedding_api/Dockerfile
    container_name: ai_pm_embedding_api
    ports:
      - "8001:8001"
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai_pm_frontend
    ports:
      - "5173:5173"
    env_file:
      - frontend/.env.local
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend